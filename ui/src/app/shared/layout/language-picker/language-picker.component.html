<p-select [options]="languages"
          [(ngModel)]="selectedLang"
          (onChange)="onLanguageChange()">
  <ng-template #selectedItem>
    <span class="fi fi-{{langToFlag(selectedLang)}}"></span> {{ selectedLang }}
  </ng-template>
  <ng-template let-lang #item>
    <span class="fi fi-{{langToFlag(lang)}}"></span> {{ lang }}
  </ng-template>
</p-select>
