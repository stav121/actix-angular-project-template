<header>
  @if (isLoggedIn) {
    <div style="width: 100%">
      <p-toolbar>
        <ng-template #start>
          <p-avatar icon="pi pi-home"
                    size="normal"
                    shape="square"/>
        </ng-template>
        <ng-template #center>
          @if (this.isAlive) {
            <div>
              <button [class.heartbeat]="this.animateHeartbeat"
                      (animationend)="this.animateHeartbeat = false"
                      pTooltip="Server is OK"
                      pButton
                      pRipple
                      [rounded]="true"
                      [iconOnly]="true"
                      severity="success">
                <i class="pi pi-heart"></i>
              </button>
            </div>
          }
          @if (!this.isAlive) {
            <div>
              <button [class.heartbeat]="this.animateHeartbeat"
                      (animationend)="this.animateHeartbeat = false"
                      pTooltip="Server is OK"
                      pButton
                      pRipple
                      [rounded]="true"
                      [iconOnly]="true"
                      severity="danger">
                <i class="pi pi-heart"></i>
              </button>
            </div>
          }
        </ng-template>
        <ng-template #end>
          <!-- Avatar with menu -->
          <p-avatar icon="pi pi-user"
                    size="normal"
                    shape="circle"
                    (click)="avatarMenu.toggle($event)"
          />
          <p-tieredmenu #avatarMenu
                        [popup]="true"
                        [model]="menuItems">
          </p-tieredmenu>
        </ng-template>
      </p-toolbar>
    </div>
  }
</header>
