<p-toast></p-toast>

<!-- Show router outlet directly -->
@if (isLive) {
  <div class="flex flex-column">
    @if (isLoggedIn) {
      <app-menubar></app-menubar>
    }
    <div class="flex flex-column">
      <router-outlet></router-outlet>
    </div>
  </div>
}

@if (!isLive) {
  <div class="flex flex-column">
    <strong>The server is not running!</strong>
  </div>
}
