[package]
name = "api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Stavros Grigoriou <unix121@protonmail.com>"]
description = "Template project that uses Actix Web and Angular"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "api"

[dependencies]
actix-web = "4.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = "1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
secrecy = { version = "0.10", features = ["serde"] }
tracing-actix-web = "0.7"
argon2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "macros", "migrate"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies"] }
