services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: ./ui
      dockerfile: ./Dockerfile
    ports:
      - "4200:80"

  # Database migrations are applied by the API on startup.
  api:
    build:
      context: ./api
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
